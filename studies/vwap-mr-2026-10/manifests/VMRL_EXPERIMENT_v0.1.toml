# VMR-L experiment — PROPOSED v0.1 (2026-10-16). NOT RUN. Refuses real data until frozen.
# Definition: VMRL_FAMILY_PROPOSAL_v0.1.md. Data choice (fresh capture vs August corpus) is a review item.

limitations = [
  "Exploratory: the data was explored for VWAP/EMA continuation before; no mean-reversion configuration has been run on it; nothing here is a holdout.",
  "Data quality: some 1-minute extremes are not corroborated by an independent hourly source (docs/lab/DATA_QUALITY_2026-10-16.md); stop fills on those minutes are reported post-run.",
  "Single instrument (SPY), bar-based execution, $0.0135/share/side, 1x notional sizing.",
  "K = 4.0 (about the P90 of |E|) is a pre-declared, trade-blind magnitude; MR2 tests 5.0. No threshold search.",
]

[experiment]
id = "VMRL-EXP"
title = "VWAP mean reversion (VMR-L) + SPY session-hold"
study = "studies/vwap-mr-2026-10"
description = "MR0 baseline (failed extension after a >= 4 ATR displacement, exit at VWAP) and four one-factor variants (entry, magnitude, shock context, exit), with a session-hold benchmark."
trials_planned = 5
dsr_threshold_implied = "illustrative independent-trials null approximation, to be computed at freeze from N=5 and the scored session count; not a significance threshold"
status = "PROPOSED"

[data]
dataset = "spy-1m-polygon-20241016-20261015-cap20261016-729dc4e9"
warmup_sessions = 5

[execution]
cash = 100000.0
commission_per_share = 0.0035
slippage_per_share = 0.01
flatten_minutes = 5

[windows]
calendar_halves = true
recent_months = 6

[[variants]]
id = "MR0"
role = "baseline"
label = "MR0 baseline"
strategy = "stratlab.strategies.vwap_mean_reversion:VwapMeanReversion"
params = { k = 4.0 }
difference = "Previous 5m bar closed >= 4.0 ATR14 beyond session VWAP (hlc3); this bar made no new extreme and closed back toward VWAP; bar ends 10:00-15:00 ET; stop beyond the failed extreme (min 5 bps); exit when a later bar closes at/through VWAP; no cooldown (re-entry on the same displacement allowed)."
hypothesis = "A failed extension after a large displacement from VWAP reverts toward VWAP with positive net R."
mechanism = "The order flow behind a large, fast displacement exhausts; liquidity leans against it once extension fails."
primary_metric = "Expectancy R (net) with t-stat; daily-equity Sharpe as the portfolio view"
uninformative_if = "Fewer than 200 closed trades in the full window."

[[variants]]
id = "MR1"
label = "MR1 extension only"
strategy = "stratlab.strategies.vwap_mean_reversion:VwapMeanReversion"
params = { k = 4.0, trigger = "extension_only" }
difference = "Entry on the extended bar itself (no failed-extension confirmation); stop beyond that bar's extreme."
hypothesis = "Waiting for a failed extension improves outcomes over entering on the extension."
mechanism = "Confirmation filters displacements that are still extending."
primary_metric = "Delta expectancy R vs MR0"
uninformative_if = "Fewer than 100 trades differ from MR0 (added + removed + altered)."

[[variants]]
id = "MR2"
label = "MR2 K = 5.0"
strategy = "stratlab.strategies.vwap_mean_reversion:VwapMeanReversion"
params = { k = 5.0 }
difference = "Extension threshold 5.0 ATR (about P96 of |E|) instead of 4.0."
hypothesis = "More extreme displacements revert more reliably."
mechanism = "Larger imbalances exhaust more completely."
primary_metric = "Delta expectancy R vs MR0"
uninformative_if = "MR2 has fewer than 100 closed trades."

[[variants]]
id = "MR3"
label = "MR3 shock only"
strategy = "stratlab.strategies.vwap_mean_reversion:VwapMeanReversion"
params = { k = 4.0, shock_filter = true }
difference = "Requires a bar with |E| < 1.0 among the up-to-6 in-session bars before the extended bar (displacement arrived quickly)."
hypothesis = "Reversion follows quick shocks but not sustained directional structure."
mechanism = "Shocks exhaust; sustained structure reflects a trend that VWAP lags."
primary_metric = "Delta expectancy R vs MR0; expectancy of removed (non-shock) trades"
uninformative_if = "MR3 has fewer than 100 closed trades, or fewer than 100 trades differ from MR0."

[[variants]]
id = "MR4"
label = "MR4 half-way target"
strategy = "stratlab.strategies.vwap_mean_reversion:VwapMeanReversion"
params = { k = 4.0, exit_mode = "half_target" }
difference = "Exit at a fixed target halfway from the signal close to VWAP (placed at entry); no VWAP-close exit."
hypothesis = "A partial-reversion target beats waiting for a full return to VWAP."
mechanism = "Reversion is often partial; a nearer target is reached more often."
primary_metric = "Delta expectancy R vs MR0; win rate; actual reward/risk at fill"
uninformative_if = "Same-minute stop/target exits exceed 5% of MR4 trades."

[[variants]]
id = "BENCH"
role = "benchmark"
label = "SPY session-hold (benchmark)"
strategy = "stratlab.strategies.benchmarks:SessionHold"
params = {}
difference = "Benchmark, not a trial: buy 99.9% notional at the 09:31 open, sell at the calendar flatten; same capital and costs."
hypothesis = "Reference only."
primary_metric = "Daily-equity metrics only (no R)"

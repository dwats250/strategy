[project]
name = "stratlab"
version = "0.1.0"
description = "Reusable strategy research lab: explicit rules -> baseline and variants -> repeatable runs -> interactive reports"
requires-python = ">=3.12,<3.14"
dependencies = [
    "backtesting==0.6.6",
    "bokeh==3.10.1",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "exchange-calendars==4.13.2",
    "plotly==7.1.0",
    "itables==2.9.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
stratlab = "stratlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
